# The sentence under your name on the home page.
lead: >-
  I use radars and disdrometers to learn how rain forms and falls, from the
  microphysics aloft to the drops that reach the ground, especially where
  mountains get involved.

# Research-interest cards on the home page. Keep each to a sentence or two.
interests:
  - title: Radar microphysics
    text: >-
      Using radars, especially dual-polarization radars, to learn what
      precipitation is doing aloft: how drops grow, break up and evaporate on
      their way down.
  - title: Drop size distributions
    text: >-
      How different microphysical processes shape particle and drop size
      distributions, and how universal those distributions are, for example
      under double-moment normalization.
  - title: Instruments and observations
    text: >-
      I'm an observationalist at heart. I like working hands-on with
      instruments, mostly disdrometers and radars, both scanning and
      vertically pointing.
  - title: Mei-Yu fronts and terrain
    text: >-
      Mesoscale meteorology where it meets precipitation, especially Mei-Yu
      fronts and how Taiwan's mountains shape their rainfall.
  - title: Open-source tools
    text: >-
      Software and algorithms that are open source and help the field move
      itself forward, like EccoPy.

