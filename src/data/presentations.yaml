# Conference presentations and invited talks, newest first. Used by the
# Publications page and the CV (awards here also appear in the CV's Awards list).
#
# Fields:
#   meeting, location, year   the conference
#   ends      last day of the meeting (YYYY-MM-DD); before then it's tagged "Upcoming"
#   type      talk | poster | invited (leave empty if unsure)
#   award     e.g. "1st Place Poster"
#   poster    optional: a PDF in public/posters/ plus a preview image in
#             src/assets/posters/, which adds an expandable preview, e.g.
#               poster:
#                 pdf: radar2025.pdf
#                 image: radar2025.jpg

